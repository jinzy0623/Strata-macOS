name: Apple Silicon
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native ARM64 tools and ggml Metal
        run: ./setup-macos.sh
      - name: API and backend tests
        run: .venv/bin/python -m unittest serve.test_server tests_macos.test_backend -v
      # CI deliberately does not download model weights or claim GPU inference.
      # Real device smoke: python -m tests_macos.smoke_gguf /path/chat-model.gguf
